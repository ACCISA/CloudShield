x-api-env: &api_env
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
  MONGO_URL: "${MONGO_URL}"
  MONGO_DB: "${MONGO_DB}"
  CLOUDSHIELD_DEV_TOKEN: "${CLOUDSHIELD_DEV_TOKEN}"
  CLOUDSHIELD_DEV_EMAIL: "${CLOUDSHIELD_DEV_EMAIL}"
  CLOUDSHIELD_DEV_ROLE: "${CLOUDSHIELD_DEV_ROLE}"
  CLOUDSHIELD_DEV_ORG: "${CLOUDSHIELD_DEV_ORG}"
  JWT_SECRET: "${JWT_SECRET}"
  JWT_ISS: "${JWT_ISS}"
  JWT_AUD: "${JWT_AUD}"
  JWT_EXPIRE_SECONDS: "${JWT_EXPIRE_SECONDS}"
  EMAIL_ENABLED: "${EMAIL_ENABLED}"
  SMTP_HOST: "${SMTP_HOST}"
  SMTP_PORT: "${SMTP_PORT}"
  SMTP_USER: "${SMTP_USER}"
  SMTP_PASSWORD: "${SMTP_PASSWORD}"
  SMTP_FROM: "${SMTP_FROM}"
  SMTP_USE_TLS: "${SMTP_USE_TLS}"
  DESKTOP_APP_DOWNLOAD_URL_WINDOWS: "${DESKTOP_APP_DOWNLOAD_URL_WINDOWS}"
  DESKTOP_APP_DOWNLOAD_URL_MAC: "${DESKTOP_APP_DOWNLOAD_URL_MAC}"
  DESKTOP_APP_DOWNLOAD_URL_LINUX: "${DESKTOP_APP_DOWNLOAD_URL_LINUX}"
  DEPLOYMENT_MODE: "docker"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis:6379/0"
  ES_URL: "http://elasticsearch:9200"
  WORKSTATIONS_MOUNT_DIR: "${WORKSTATIONS_MOUNT_DIR}"
  WINDOWS_ISO_PATH: "${WINDOWS_ISO_PATH}"
  KVM: "Y"
  GEMINI_API_KEY: "${GEMINI_API_KEY}"
  CLOUDSHIELD_SERVER_URL: "${CLOUDSHIELD_SERVER_URL:-https://real.encs.concordia.ca}"
  CLOUDSHIELD_LOG_DIR: "/tmp/cloudshield-logs"
  CS_API_CONTAINER: "cs-api-prod"
  CS_UI_CONTAINER: "cs-ui-prod"
  TZ: "UTC"

x-api-volumes: &api_volumes
  - ${WORKSTATIONS_MOUNT_DIR}:/data
  - ${CLOUDSHIELD_DATA_MOUNT_DIR}:/var/lib/cloudshield/terraform
  - /var/run/docker.sock:/var/run/docker.sock

services:
  redis:
    image: redis:7-alpine
    container_name: cloudshield-redis-prod
    command: ["redis-server", "--stop-writes-on-bgsave-error", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      vpc_net:
        ipv4_address: "172.23.1.5"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: cloudshield-elasticsearch-prod
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      cloudshield_net:
        ipv4_address: "172.28.0.5"

  api-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.api_test.prod
    image: cloudshield-api-test:prod
    container_name: cs-api-prod
    command: ["python", "/app/cloudshield/Server/server.py"]
    environment: *api_env
    volumes: *api_volumes
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:5050"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5050/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      vpc_net:
        ipv4_address: "172.23.1.30"
      cloudshield_net:
        ipv4_address: "172.28.0.30"

  api-worker:
    image: cloudshield-api-test:prod
    container_name: cs-api-worker-prod
    command: ["rq", "worker", "api", "--url", "redis://redis:6379/0"]
    working_dir: /app/cloudshield/Server
    environment: *api_env
    volumes: *api_volumes
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      vpc_net:
        ipv4_address: "172.23.1.31"
      cloudshield_net:
        ipv4_address: "172.28.0.31"

  workstations-worker:
    image: cloudshield-api-test:prod
    container_name: cs-workstations-worker-prod
    command: ["rq", "worker", "workstations", "--url", "redis://redis:6379/0"]
    working_dir: /app/cloudshield/Server
    environment: *api_env
    volumes: *api_volumes
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      vpc_net:
        ipv4_address: "172.23.1.32"
      cloudshield_net:
        ipv4_address: "172.28.0.32"

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui.prod
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
        VITE_API_ACCESS_TOKEN: "${VITE_API_ACCESS_TOKEN}"
        VITE_PUBLIC_POSTHOG_KEY: "${VITE_PUBLIC_POSTHOG_KEY}"
        VITE_PUBLIC_POSTHOG_HOST: "${VITE_PUBLIC_POSTHOG_HOST}"
        VITE_POSTHOG_ENABLED: "${VITE_POSTHOG_ENABLED}"
        VITE_STRIPE_PUBLIC_KEY: "${VITE_STRIPE_PUBLIC_KEY}"
    image: cloudshield-ui:prod
    container_name: cs-ui-prod
    depends_on:
      api-test:
        condition: service_started
    environment:
      TZ: "UTC"
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      vpc_net:
        ipv4_address: "172.23.1.20"
      cloudshield_net:
        ipv4_address: "172.28.0.20"

networks:
  vpc_net:
    external: true
    name: ${VPC_NET_NAME:-vpc_net}

  cloudshield_net:
    external: true
    name: ${CLOUDSHIELD_NET_NAME:-cloudshield_cloudshield_net}

volumes:
  redis_data:
  es_data:

name: Server Python Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f cloudshield/Server/requirements.txt ]; then pip install -r cloudshield/Server/requirements.txt || true; fi
          pip install pytest pytest-cov

      - name: Prepare coverage directory
        run: mkdir -p tests/python/coverage/server

      - name: Run pytest with coverage (Server)
        run: |
          pytest --rootdir=cloudshield/Server --cov=cloudshield.Server \
            --cov-report=term --cov-report=xml:tests/python/coverage/server/coverage.xml || true

      - name: Upload Server coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: tests/python/coverage/server/coverage.xml

name: Build Images (GHCR)
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [Server, Agent]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./cloudshield/${{ matrix.component }}
          file: ./cloudshield/${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudshield-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/cloudshield-${{ matrix.component }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/cloudshield-{1}:{2}', github.repository_owner, matrix.component, github.ref_name) || '' }}

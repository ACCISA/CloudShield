name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-images:
    name: Build & Push Docker Images (api/server/agent)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, server, agent]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner & component
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "COMPONENT_LC=${{ matrix.component }}" >> "$GITHUB_ENV"

      - name: Build & Push ${{ env.COMPONENT_LC }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: docker/Dockerfile.${{ env.COMPONENT_LC }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudshield-${{ env.COMPONENT_LC }}:latest
            ghcr.io/${{ env.OWNER_LC }}/cloudshield-${{ env.COMPONENT_LC }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') &&
                format('ghcr.io/{0}/cloudshield-{1}:{2}',
                       env.OWNER_LC, env.COMPONENT_LC, github.ref_name) || '' }}

  binaries:
    name: Build Standalone Binaries (no upload)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: Agent
            entry: cloudshield/Agent/main.py
          - component: Server
            entry: cloudshield/ThreatDetection/server.py
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build ${{ matrix.component }} binary
        shell: bash
        run: |
          pyinstaller --onefile "${{ matrix.entry }}" \
            --name "cloudshield-${{ matrix.component }}" \
            --distpath "dist/${{ matrix.component }}"

      - name: Verify binary exists (no upload)
        shell: bash
        run: |
          test -f "dist/${{ matrix.component }}/cloudshield-${{ matrix.component }}"
          ls -lh "dist/${{ matrix.component }}/cloudshield-${{ matrix.component }}"

  desktopui:
    name: Build DesktopUI (no container)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudshield/DesktopUI
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: cloudshield/DesktopUI/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload DesktopUI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktopui-build-${{ github.sha }}
          path: cloudshield/DesktopUI/build
          if-no-files-found: error
          retention-days: 7

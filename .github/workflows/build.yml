name: Build Images (GHCR)

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [Server, Agent]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase names
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          echo "COMPONENT_LC=$(echo '${{ matrix.component }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./cloudshield/${{ matrix.component }}
          file: ./cloudshield/${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudshield-${{ env.COMPONENT_LC }}:latest
            ghcr.io/${{ env.OWNER_LC }}/cloudshield-${{ env.COMPONENT_LC }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/cloudshield-{1}:{2}', env.OWNER_LC, env.COMPONENT_LC, github.ref_name) || '' }}

  binaries:
    name: Build Standalone Binaries (no upload)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: Agent
            entry: cloudshield/Agent/main.py
            req: cloudshield/Agent/requirements.txt
          - component: Server
            entry: cloudshield/Server/server.py
            req: cloudshield/Server/requirements.txt
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f "${{ matrix.req }}" ]; then pip install -r "${{ matrix.req }}"; fi

      - name: Build ${{ matrix.component }} binary
        shell: bash
        run: |
          pyinstaller --onefile "${{ matrix.entry }}" \
            --name "cloudshield-${{ matrix.component }}" \
            --distpath "dist/${{ matrix.component }}"

      - name: Verify binary exists (no upload)
        shell: bash
        run: |
          test -f "dist/${{ matrix.component }}/cloudshield-${{ matrix.component }}"
          ls -lh "dist/${{ matrix.component }}/cloudshield-${{ matrix.component }}"

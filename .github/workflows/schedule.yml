name: Nightly Build
on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [Server, Agent]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Nightly
        uses: docker/build-push-action@v6
        with:
          context: ./cloudshield/${{ matrix.component }}
          file: ./cloudshield/${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudshield-${{ matrix.component }}:nightly
            ghcr.io/${{ github.repository_owner }}/cloudshield-${{ matrix.component }}:nightly-${{ github.run_id }}

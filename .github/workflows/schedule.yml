name: Nightly Build

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [Server, Agent]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase names
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          echo "COMPONENT_LC=$(echo '${{ matrix.component }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Nightly
        uses: docker/build-push-action@v6
        with:
          context: ./cloudshield/${{ matrix.component }}
          file: ./cloudshield/${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudshield-${{ env.COMPONENT_LC }}:nightly
            ghcr.io/${{ env.OWNER_LC }}/cloudshield-${{ env.COMPONENT_LC }}:nightly-${{ github.run_id }}

name: Lint (Ruff)

on:
  push:
    paths:
      - 'cloudshield/Server/**'
      - 'cloudshield/Agent/**'
      - 'ruff.toml'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'cloudshield/Server/**'
      - 'cloudshield/Agent/**'
      - 'ruff.toml'
      - '.github/workflows/lint.yml'

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check cloudshield/Server cloudshield/Agent

name: Testing and Code Analysis

on: [push, pull_request]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  retrieve_branch:
    name: Retrieve Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set_branch.outputs.branch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Branch Name (PR)
        id: set_branch
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "branch=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT

      - name: Set Branch Name (Push)
        id: set_branch_push
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

  test_python:
    runs-on: ubuntu-latest
    needs: retrieve_branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Prepare Python coverage directory
        run: |
          mkdir -p tests/python/coverage

      - name: Run pytest with coverage
        run: |
          # Run pytest across repository; generate XML coverage report for Sonar
          pytest --rootdir=. --cov=cloudshield \
            --cov-report=term \
            --cov-report=xml:tests/python/coverage/coverage.xml || true

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: tests/python/coverage/coverage.xml

      - name: Upload pytest output
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: tests/python

  test_js:
    name: Run DesktopUI JS tests
    runs-on: ubuntu-latest
    needs: retrieve_branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install DesktopUI dependencies
        working-directory: cloudshield/DesktopUI
        run: |
          npm ci

      - name: Run DesktopUI tests with coverage
        working-directory: cloudshield/DesktopUI
        run: |
          CI=true npm test -- --coverage --watchAll=false || true

      - name: Collect JS coverage
        run: |
          mkdir -p tests/js/coverage
          if [ -f cloudshield/DesktopUI/coverage/lcov.info ]; then
            cp cloudshield/DesktopUI/coverage/lcov.info tests/js/coverage/lcov.info
          else
            echo "" > tests/js/coverage/lcov.info
          fi

      - name: Upload JS coverage
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: tests/js/coverage/lcov.info

  sonar_scan:
    runs-on: ubuntu-latest
    needs: [test_python, retrieve_branch, test_js]
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java (required for SonarQube scanner)
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: tests/python/coverage

      - name: Download JS coverage
        uses: actions/download-artifact@v4
        with:
          name: js-coverage
          path: tests/js/coverage

      - name: Install SonarQube Scanner
        run: |
          curl -sL -o scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q scanner.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.organization=${SONAR_ORG} \
            -Dsonar.projectKey=${{ github.repository }} \
            -Dsonar.sources=cloudshield \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.coverage.exclusions=**/tests \
            -Dsonar.exclusions=**/tests \
            -Dsonar.python.coverage.reportPaths=tests/python/coverage/coverage.xml \
            -Dsonar.javascript.lcov.reportPaths=tests/js/coverage/lcov.info || true

name: Agent Windows Build & Release

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Agent Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r cloudshield/Agent/requirements.txt

      - name: Build agent executable with PyInstaller
        shell: pwsh
        working-directory: cloudshield/Agent
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          pyinstaller --noconfirm --clean main.spec

      - name: Determine version metadata
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $refName = "${{ github.ref_name }}"
          $sha = "${{ github.sha }}"
          $runNumber = "${{ github.run_number }}"

          if (-not $runNumber) { $runNumber = "0" }
          if ($sha.Length -ge 7) { $shortSha = $sha.Substring(0,7) } else { $shortSha = $sha }

          if ($ref -like "refs/tags/v*") {
            $version = $refName
          } else {
            $latestTag = $null
            try {
              $latestTag = git tag --list "v*" |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ } |
                Sort-Object {
                  $normalized = $_.TrimStart('v')
                  if ($normalized.Contains('-')) {
                    $normalized = $normalized.Split('-', 2)[0]
                  }
                  try { [version]$normalized } catch { [version]'0.0.0' }
                } -Descending |
                Select-Object -First 1
            } catch {
              $latestTag = $null
            }
            if (-not $latestTag) { $latestTag = "v0.0.0" }
            $version = "$latestTag+build.$runNumber.sha.$shortSha"
          }

          $artifact = "cloudshield-agent-$version"
          $artifact = $artifact -replace '[^A-Za-z0-9._-]', '-'

          if (-not $env:GITHUB_OUTPUT) {
            throw "GITHUB_OUTPUT environment variable is not set"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package executable
        id: package
        shell: pwsh
        run: |
          $stageDir = Join-Path $env:RUNNER_TEMP "${{ steps.version.outputs.artifact }}"
          if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          $distRoot = Join-Path (Get-Location) "cloudshield/Agent/dist"
          $oneFolderPath = Join-Path $distRoot "main"
          $oneFilePath = Join-Path $distRoot "main.exe"

          if (Test-Path $oneFolderPath) {
            Copy-Item -Path (Join-Path $oneFolderPath '*') -Destination $stageDir -Recurse -Force
            $exePath = Join-Path $stageDir "main.exe"
          } elseif (Test-Path $oneFilePath) {
            Copy-Item -Path $oneFilePath -Destination $stageDir -Force
            $exePath = Join-Path $stageDir "main.exe"
          } else {
            throw "PyInstaller output not found in $distRoot"
          }

          if (Test-Path $exePath) {
            Rename-Item -Path $exePath -NewName "cloudshield-agent.exe" -Force
          } else {
            throw "Built executable not found after copy (expected $exePath)"
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "${{ steps.version.outputs.artifact }}.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Push-Location $stageDir
          try {
            Compress-Archive -Path * -DestinationPath $zipPath
          } finally {
            Pop-Location
          }
          "stage_dir=$stageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Smoke test executable launch
        shell: pwsh
        run: |
          $stageDir = "${{ steps.package.outputs.stage_dir }}"
          $exe = Join-Path $stageDir "cloudshield-agent.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable not found at $exe"
          }
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -WorkingDirectory $stageDir
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) {
              throw "Executable exited early with code $($proc.ExitCode)"
            }
          } else {
            Stop-Process -Id $proc.Id -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package.outputs.zip_path }}
          tag_name: ${{ github.ref_name }}
          name: CloudShield Agent ${{ steps.version.outputs.version }}
          body: |
            Automated CloudShield Agent build for `${{ github.ref_name }}`.
            - Commit: `${{ github.sha }}`
            - Workflow run: `${{ github.run_id }}`
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

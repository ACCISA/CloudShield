name: CI + Sonar Coverage Analysis

on:
  pull_request:
    paths:
      - 'cloudshield/**'

permissions:
  contents: read

jobs:
  # 1️⃣ Agent Python tests
  test_agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f cloudshield/Agent/requirements.txt ]; then pip install -r cloudshield/Agent/requirements.txt || true; fi
          pip install pytest pytest-cov

      - name: Prepare coverage directory
        run: mkdir -p tests/python/coverage/agent

      - name: Run pytest with coverage (Agent)
        run: |
          pytest --rootdir=cloudshield/Agent --cov=cloudshield.Agent \
            --cov-report=term --cov-report=xml:tests/python/coverage/agent/coverage.xml || true

      - name: Upload Agent coverage
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: tests/python/coverage/agent/coverage.xml

  # 2️⃣ Server Python tests
  test_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f cloudshield/Server/requirements.txt ]; then pip install -r cloudshield/Server/requirements.txt || true; fi
          pip install pytest pytest-cov

      - name: Prepare coverage directory
        run: mkdir -p tests/python/coverage/server

      - name: Run pytest with coverage (Server)
        run: |
          pytest --rootdir=cloudshield/Server --cov=cloudshield.Server \
            --cov-report=term --cov-report=xml:tests/python/coverage/server/coverage.xml || true

      - name: Upload Server coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: tests/python/coverage/server/coverage.xml

  # 3️⃣ DesktopUI JS tests
  test_desktopui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install DesktopUI dependencies
        working-directory: cloudshield/DesktopUI
        run: npm ci

      - name: Run DesktopUI tests with coverage
        working-directory: cloudshield/DesktopUI
        run: CI=true npm test -- --coverage --watchAll=false || true

      - name: Collect JS coverage
        run: |
          mkdir -p tests/js/coverage/desktopui
          if [ -f cloudshield/DesktopUI/coverage/lcov.info ]; then
            cp cloudshield/DesktopUI/coverage/lcov.info tests/js/coverage/desktopui/lcov.info
          else
            echo "" > tests/js/coverage/desktopui/lcov.info
          fi

      - name: Upload JS coverage
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage-desktopui
          path: tests/js/coverage/desktopui/lcov.info

  # 4️⃣ Sonar scan (runs AFTER all three tests finish)
  sonar_scan:
    runs-on: ubuntu-latest
    needs: [test_agent, test_server, test_desktopui]
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java (required for SonarQube scanner)
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk

      - name: Download Agent coverage
        uses: actions/download-artifact@v4
        with:
          name: agent-coverage
          path: tests/python/coverage/agent
        continue-on-error: true

      - name: Download Server coverage
        uses: actions/download-artifact@v4
        with:
          name: server-coverage
          path: tests/python/coverage/server
        continue-on-error: true

      - name: Download DesktopUI coverage
        uses: actions/download-artifact@v4
        with:
          name: js-coverage-desktopui
          path: tests/js/coverage/desktopui
        continue-on-error: true

      - name: Install SonarQube Scanner
        run: |
          curl -sL -o scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q scanner.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.organization=${SONAR_ORG} \
            -Dsonar.projectKey=my-org_my-project \
            -Dsonar.sources=cloudshield \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.coverage.exclusions=tests/**,cloudshield/**/agent_pb2.py,cloudshield/**/agent_pb2_grpc.py,cloudshield/**/logger.py \
            -Dsonar.exclusions=tests/**,cloudshield/**/agent_pb2.py,cloudshield/**/agent_pb2_grpc.py,cloudshield/**/logger.py \
            -Dsonar.python.coverage.reportPaths=tests/python/coverage/agent/coverage.xml,tests/python/coverage/server/coverage.xml \
            -Dsonar.javascript.lcov.reportPaths=tests/js/coverage/desktopui/lcov.info || true

      - name: Get SonarCloud Results
        run: "echo 'Check SonarCloud Report: https://sonarcloud.io/summary/new_code?id=ACCISA_CloudShield&pullRequest={{ github.event.pull_request.number }}'"


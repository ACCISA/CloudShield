# ============================================================================
# Minimal Snort configuration for CloudShield VPN monitoring
# ============================================================================
# Copy or symlink to /etc/snort/snort.conf on the VPN gateway.
#
# Usage:
#   snort -c /etc/snort/snort.conf -i tun0 -A fast -l /var/log/snort

# --- Network variables ---
ipvar HOME_NET 10.8.0.0/24
ipvar EXTERNAL_NET !$HOME_NET
portvar VPN_PORT 1194

# --- Paths ---
var RULE_PATH /etc/snort/rules

# --- Logging ---
output alert_fast: /var/log/snort/alert
output alert_full: /var/log/snort/alert_full

# --- Rules ---
include $RULE_PATH/local.rules

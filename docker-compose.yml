services:
  redis:
    image: redis:7
    command: ["redis-server", "--stop-writes-on-bgsave-error", "no"]
    ports:
      - "6379:6379"
    networks:
      vpc_net:
        ipv4_address: "172.23.${VPC_OCTET:-1}.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: "cs-ui-${ORG_TAG:-dev}"
    environment:
      - VITE_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_ACCESS_TOKEN=${VITE_API_ACCESS_TOKEN}
      - VITE_API_PROXY_TARGET=http://api-test:5050
    ports:
      - "5173:5173"
    networks:
      vpc_net:
        ipv4_address: "172.23.${VPC_OCTET:-1}.20"
      cloudshield_net:
        ipv4_address: 172.28.0.20
    volumes:
      - ./cloudshield/WebUI:/app
      - ui_node_modules:/app/node_modules

  openvpn-test:
    profiles: ["template"] # Starts only when template provisioning flow requests it
    image: cs-openvpn-template:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.openvpn_test
    privileged: true
    cgroup: host
    tty: true
    stdin_open: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - openvpn_port=${OPENVPN_PORT}
      - openvpn_protocol=${OPENVPN_PROTOCOL}
      - openvpn_client_name=${OPENVPN_CLIENT_NAME}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "1194:1194/tcp"
    networks:
      - vpn_internal

  samba-test:
    profiles: ["template"] # Starts only when template provisioning flow requests it
    image: cs-samba-template:latest
    build:
      context: .
      args:
        - ORG_ID=${DOMAIN_NAME}
      dockerfile: docker/Dockerfile.samba_test
    dns:
      - 8.8.8.8
      - 1.1.1.1
    privileged: true
    cgroup: host
    tty: true
    stdin_open: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    environment:
      - domain_name=${DOMAIN_NAME}
      - dc_admin_password=${DC_ADMIN_PASSWORD}
      - realm_name=${REALM_NAME}
      - realm_name_lwr=${REALM_NAME_LWR}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    devices:
      - /dev/loop0:/dev/loop0
      - /dev/loop1:/dev/loop1
      - /dev/loop2:/dev/loop2
      - /dev/loop3:/dev/loop3
      - /dev/loop4:/dev/loop4
      - /dev/loop5:/dev/loop5
      - /dev/loop6:/dev/loop6
      - /dev/loop7:/dev/loop7
      - /dev/loop-control:/dev/loop-control

  workstation:
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    profiles: ["template"] # Starts only when template provisioning flow requests it
    image: cs-workstation-template:latest
    build:
      context: ./docker/workstation
      dockerfile: Dockerfile.workstation_test
    environment:
      USERNAME: "bill"
      PASSWORD: "gates"
      VERSION: "11"
      KVM: "Y"
      DISK_SIZE: "${WORKSTATION_DISK_SIZE:-32G}"
      RAM_SIZE: "${WORKSTATION_RAM_SIZE:-1.5G}"
    devices:
      - /dev/kvm
      - /dev/net/tun
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    restart: "no"
    networks:
      - vpn_internal

  threat-detection:
    profiles: ["template"]
    image: app-threat-detection:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    environment:
      CLOUDSHIELD_RUNTIME: "1"

  api-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.api_test
    container_name: "cs-api-test-${ORG_TAG:-dev}"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=${MONGO_DB}
      - CLOUDSHIELD_DEV_TOKEN=${CLOUDSHIELD_DEV_TOKEN}
      - CLOUDSHIELD_DEV_EMAIL=${CLOUDSHIELD_DEV_EMAIL}
      - CLOUDSHIELD_DEV_ROLE=${CLOUDSHIELD_DEV_ROLE}
      - CLOUDSHIELD_DEV_ORG=${CLOUDSHIELD_DEV_ORG}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISS=${JWT_ISS}
      - JWT_AUD=${JWT_AUD}
      - JWT_EXPIRE_SECONDS=${JWT_EXPIRE_SECONDS}
      - EMAIL_ENABLED=${EMAIL_ENABLED}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - DESKTOP_APP_DOWNLOAD_URL_WINDOWS=${DESKTOP_APP_DOWNLOAD_URL_WINDOWS}
      - DESKTOP_APP_DOWNLOAD_URL_MAC=${DESKTOP_APP_DOWNLOAD_URL_MAC}
      - DESKTOP_APP_DOWNLOAD_URL_LINUX=${DESKTOP_APP_DOWNLOAD_URL_LINUX}
      - DEPLOYMENT_MODE=docker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - ES_URL=http://elasticsearch:9200
      - WORKSTATIONS_MOUNT_DIR=${WORKSTATIONS_MOUNT_DIR}
      - WINDOWS_ISO_PATH=${WINDOWS_ISO_PATH}
      - KVM=Y
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLOUDSHIELD_SERVER_URL=${CLOUDSHIELD_SERVER_URL}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5050:5050"
    volumes:
      - ./cloudshield:/app/cloudshield
      - ./docker:/app/docker
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSTATIONS_MOUNT_DIR}:/data
    networks:
      - vpc_net
      - cloudshield_net

  api:
    profiles: ["manual"]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: "cs-api-${ORG_TAG:-dev}"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=${MONGO_DB}
      - CLOUDSHIELD_DEV_TOKEN=${CLOUDSHIELD_DEV_TOKEN}
      - CLOUDSHIELD_DEV_EMAIL=${CLOUDSHIELD_DEV_EMAIL}
      - CLOUDSHIELD_DEV_ROLE=${CLOUDSHIELD_DEV_ROLE}
      - CLOUDSHIELD_DEV_ORG=${CLOUDSHIELD_DEV_ORG}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISS=${JWT_ISS}
      - JWT_AUD=${JWT_AUD}
      - JWT_EXPIRE_SECONDS=${JWT_EXPIRE_SECONDS}
      - EMAIL_ENABLED=${EMAIL_ENABLED}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - DESKTOP_APP_DOWNLOAD_URL_WINDOWS=${DESKTOP_APP_DOWNLOAD_URL_WINDOWS}
      - DESKTOP_APP_DOWNLOAD_URL_MAC=${DESKTOP_APP_DOWNLOAD_URL_MAC}
      - DESKTOP_APP_DOWNLOAD_URL_LINUX=${DESKTOP_APP_DOWNLOAD_URL_LINUX}
      - DEPLOYMENT_MODE=docker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - ES_URL=http://elasticsearch:9200
      - WORKSTATIONS_MOUNT_DIR=${WORKSTATIONS_MOUNT_DIR}
      - WINDOWS_ISO_PATH=${WINDOWS_ISO_PATH}
      - KVM=Y
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLOUDSHIELD_SERVER_URL=${CLOUDSHIELD_SERVER_URL}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5050:5050"
    volumes:
      - ./cloudshield:/app/cloudshield
      - ./docker:/app/docker
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vpc_net
      - cloudshield_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      cloudshield_net:
        ipv4_address: 172.28.0.5
    ports:
      - "9200:9200"



networks:
  vpc_net:
    external: true
    name: ${VPC_NET_NAME:-vpc_net}

  cloudshield_net:
    name: cloudshield_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

  vpn_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  ui_node_modules:

services:
  redis:
    image: redis:7
    command: ["redis-server", "--stop-writes-on-bgsave-error", "no"]
    ports:
      - "6379:6379"
    networks:
      vpc_net:
        ipv4_address: "172.23.${VPC_OCTET:-1}.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30

  api-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.api_test
    container_name: "cs-api-test-${ORG_TAG:-dev}"
    environment:
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=${MONGO_DB}
      - CLOUDSHIELD_DEV_TOKEN=${CLOUDSHIELD_DEV_TOKEN}
      - CLOUDSHIELD_DEV_EMAIL=${CLOUDSHIELD_DEV_EMAIL}
      - CLOUDSHIELD_DEV_ROLE=${CLOUDSHIELD_DEV_ROLE}
      - CLOUDSHIELD_DEV_ORG=${CLOUDSHIELD_DEV_ORG}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISS=${JWT_ISS}
      - JWT_AUD=${JWT_AUD}
      - JWT_EXPIRE_SECONDS=${JWT_EXPIRE_SECONDS}
      - EMAIL_ENABLED=${EMAIL_ENABLED}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - DEPLOYMENT_MODE=docker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0

      # Needed because docker compose runs INSIDE api-test when provisioning
      - WORKSTATIONS_MOUNT_DIR=${WORKSTATIONS_MOUNT_DIR:-/home/cena}
      - WORKSTATION_STORAGE_BASE=${WORKSTATION_STORAGE_BASE:-/home/cena/cloudshield_workstations}
      - WORKSTATION_PORT_BASE=${WORKSTATION_PORT_BASE:-18000}

    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5050:5050"
    networks:
      vpc_net:
        ipv4_address: "172.23.${VPC_OCTET:-1}.2"
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: "cs-ui-${ORG_TAG:-dev}"
    environment:
      - VITE_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_ACCESS_TOKEN=${VITE_API_ACCESS_TOKEN}
      - VITE_API_PROXY_TARGET=http://api-test:5050
    ports:
      - "5173:5173"
    networks:
      vpc_net:
        ipv4_address: "172.23.${VPC_OCTET:-1}.20"
      cloudshield_net:
        ipv4_address: 172.28.0.20
    volumes:
      - ./cloudshield/WebUI:/app
      - ui_node_modules:/app/node_modules

  openvpn-test:
    image: cs-openvpn-template:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.openvpn_test
    privileged: true
    cgroup: host
    tty: true
    stdin_open: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - openvpn_port=${OPENVPN_PORT}
      - openvpn_protocol=${OPENVPN_PROTOCOL}
      - openvpn_client_name=${OPENVPN_CLIENT_NAME}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - vpc_net

  samba-test:
    image: cs-samba-template:latest
    build:
      context: .
      args:
        - ORG_ID=${DOMAIN_NAME}
      dockerfile: docker/Dockerfile.samba_test
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: "cs-samba-test-${ORG_TAG:-dev}"
    privileged: true
    cgroup: host
    tty: true
    stdin_open: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    environment:
      - domain_name=${DOMAIN_NAME}
      - dc_admin_password=${DC_ADMIN_PASSWORD}
      - realm_name=${REALM_NAME}
      - realm_name_lwr=${REALM_NAME_LWR}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    devices:
      - /dev/loop0:/dev/loop0
      - /dev/loop1:/dev/loop1
      - /dev/loop2:/dev/loop2
      - /dev/loop3:/dev/loop3
      - /dev/loop4:/dev/loop4
      - /dev/loop5:/dev/loop5
      - /dev/loop6:/dev/loop6
      - /dev/loop7:/dev/loop7
      - /dev/loop-control:/dev/loop-control
    networks:
      - vpc_net

  workstation:
    image: cs-workstation-template:latest
    build:
      context: docker/workstation
      dockerfile: Dockerfile.workstation_test
    container_name: "windows-workstation-${ORG_TAG:-dev}"
    environment:
      USERNAME: "bill"
      PASSWORD: "gates"
      VERSION: "11"
      KVM: "N"
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      # IMPORTANT: /storage MUST be unique per org to avoid data.img lock
      - type: bind
        source: ${WORKSTATION_STORAGE_DIR:-${WORKSTATION_STORAGE_BASE:-/home/cena/cloudshield_workstations}/single}
        target: /storage

      # IMPORTANT: this MUST be a FILE on the host, not a directory
      - type: bind
        source: ${WORKSTATIONS_MOUNT_DIR:-/home/cena}/Desktop/CloudShield/win11x64.iso
        target: /storage/win11x64.iso
        read_only: true

      - type: bind
        source: ${WORKSTATIONS_MOUNT_DIR:-/home/cena}/docker/workstation/oem
        target: /oem

    restart: always
    stop_grace_period: 2m
    networks:
      - vpc_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: "cs-api-${ORG_TAG:-dev}"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=${MONGO_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5050:5050"
    volumes:
      - ./cloudshield:/app/cloudshield
      - ./logs:/app/logs
    networks:
      - vpc_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: "elasticsearch-${ORG_TAG:-dev}"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      cloudshield_net:
        ipv4_address: 172.28.0.5
    ports:
      - "9200:9200"

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: "server-${ORG_TAG:-dev}"
    environment:
      ES_URL: "http://elasticsearch:9200"
      CLOUDSHIELD_RUNTIME: "1"
    networks:
      cloudshield_net:
        ipv4_address: 172.28.0.10
    ports:
      - "50051:50051"

  agent1:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: "agent1-${ORG_TAG:-dev}"
    environment:
      AGENT_ID: "agent-1"
      SERVER_ADDR: "server"
      SERVER_PORT: "50051"
    depends_on:
      - server
    networks:
      cloudshield_net:
        ipv4_address: 172.28.0.11

  agent2:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: "agent2-${ORG_TAG:-dev}"
    environment:
      AGENT_ID: "agent-2"
      SERVER_ADDR: "server"
      SERVER_PORT: "50051"
    depends_on:
      - server
    networks:
      cloudshield_net:
        ipv4_address: 172.28.0.12

  agent3:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: "agent3-${ORG_TAG:-dev}"
    environment:
      AGENT_ID: "agent-3"
      SERVER_ADDR: "server"
      SERVER_PORT: "50051"
    depends_on:
      - server
    networks:
      cloudshield_net:
        ipv4_address: 172.28.0.13

networks:
  vpc_net:
    external: true
    name: ${VPC_NET_NAME:-vpc_net}

  cloudshield_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ui_node_modules:
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0 

[program:worker]
command=python /app/cloudshield/Server/worker.py
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:server]
command=python /app/cloudshield/Server/server.py
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# HTTP -> HTTPS REDIRECT
server {
    listen 80;
    server_name real.encs.concordia.ca api.real.encs.concordia.ca;
    return 301 https://$host$request_uri;
}

# HTTPS — UI
server {
    listen 443 ssl;
    server_name real.encs.concordia.ca;

    ssl_certificate     /etc/ssl/cloudshield/real.encs.concordia.ca.crt;
    ssl_certificate_key /etc/ssl/cloudshield/real.encs.concordia.ca.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:5173;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS — API
server {
    listen 443 ssl;
    server_name api.real.encs.concordia.ca;

    ssl_certificate     /etc/ssl/cloudshield/real.encs.concordia.ca.crt;
    ssl_certificate_key /etc/ssl/cloudshield/real.encs.concordia.ca.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:5050;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# HTTPS — Uptime Kuma Monitoring (External Domain)
server {
    listen 443 ssl;
    server_name cloudshield-status.duckdns.org;

    # Using the existing Concordia SSL certificates
    ssl_certificate     /etc/ssl/cloudshield/real.encs.concordia.ca.crt;
    ssl_certificate_key /etc/ssl/cloudshield/real.encs.concordia.ca.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Web UI requires WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}